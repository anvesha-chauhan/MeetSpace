spring.application.name=meetspace

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:meetspacedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# JWT Configuration (Custom property)
meetspace.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
meetspace.app.jwtExpirationMs=86400000

# Server Configuration
server.port=8080
