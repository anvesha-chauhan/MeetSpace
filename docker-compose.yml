version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: meetspace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: meetspace_db
      MYSQL_USER: meetspace_user
      MYSQL_PASSWORD: meetspace_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
